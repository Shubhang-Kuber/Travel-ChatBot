[pytest]
# Run inside Docker only:  docker compose --profile test run --rm --build test
# Unit tests alone:
#   docker compose --profile test run --rm --build test pytest -m unit
testpaths = backend/tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    unit: pure tests, no external services
    integration: real app over ASGI, mocked graph
# Coverage on every run; tests themselves are omitted (see coverage.ini).
# Add --no-cov to skip it.
addopts =
    --strict-markers
    --strict-config
    -ra
    --cov=backend
    --cov-config=backend/tests/coverage.ini
    --cov-report=term-missing
