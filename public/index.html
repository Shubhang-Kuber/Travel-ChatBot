<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelBot - AI Travel Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <header class="hero-header">
        <div class="hero-content">
            <h1 class="hero-title">
                <span class="hero-text">Travel</span>
                <span class="hero-text-accent">Bot</span>
                <span class="hero-cursor">_</span>
            </h1>
            <p class="hero-subtitle">Your AI-Powered Travel Companion</p>
        </div>
    </header>
    <div class="container">
        <!-- Chat Assistant -->
        <div class="assistant-terminal">
            <div class="terminal-header">
                <div class="terminal-dots">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
                <div class="terminal-title">Travel Assistant</div>
            </div>
            <div class="terminal-body" id="terminal-body">
                <!-- Messages will be added here dynamically -->
            </div>
        </div>

        <!-- Form Section -->
        <div class="form-section" id="form-section">
            <button class="minimize-btn" id="minimize-btn" title="Minimize Form">
                <i class="fas fa-minus"></i>
            </button>
            
            <div class="expand-icon" id="expand-icon">
                <i class="fas fa-edit"></i>
            </div>
            
            <div class="form-content">
                <div class="form-header">
                    <h1 class="form-title">Plan Your Journey</h1>
                    <p class="form-subtitle">Create your perfect itinerary with TravelBot's assistance</p>
                </div>

                <form class="itinerary-form" id="itinerary-form">
                    <div class="stops-container" id="stops-container">
                        <!-- Stops will be dynamically added here -->
                    </div>
                    
                    <button type="button" class="btn btn-secondary add-stop-btn" id="add-stop">
                        <i class="fas fa-plus"></i>
                        Add Another Stop
                    </button>
                    
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-magic"></i>
                            Get AI Suggestions
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script defer src="./script.js"></script>
</body>
</html>
